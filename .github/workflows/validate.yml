name: Validate WPAI Constitution Source

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set the initial branch for disposable checkout repositories
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Validate canonical source invariants
        run: python tools/validate-source.py
      - name: Test mirror and inventory behavior
        run: python -X utf8 -W error -m unittest discover -s tests -v
      - name: Enforce meaningful evolution on pull requests
        if: github.event_name == 'pull_request'
        run: python tools/evolution-guard.py --base "${{ github.event.pull_request.base.sha }}"

  validate:
    if: ${{ always() }}
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - name: Require every source validation cohort
        run: test '${{ needs.source.result }}' = 'success'
